    <h6>Tools Used</h6>
    <p>
        To bring this project to life, we relied on a wide range of tools. We built the gameplay in <em class="text-highlight1">Unity</em>, 
        designed 3D assets in <em class="text-highlight2">3ds Max</em>, 
        and created 2D visuals using <em class="text-highlight1">Illustrator</em> and <em class="text-highlight2">Photoshop</em>. 
        Sound effects were produced in <em class="text-highlight1">Adobe Audition</em>, and we used <em class="text-highlight2">InDesign</em> for documentation.
